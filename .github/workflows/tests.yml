name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test matrix selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_matrix_test.py'
      - name: Select formula platforms
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/test-matrix.sh "$EVENT" "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"

  test-bot:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Verify macOS version
        if: matrix.macos != ''
        env:
          EXPECTED_MACOS: ${{ matrix.macos }}
        run: test "$(sw_vers -productVersion | cut -d. -f1)" = "$EXPECTED_MACOS"

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Detect formulae changed by push
        id: pushed-formulae
        if: github.event_name == 'push'
        run: |
          repository="${{ steps.set-up-homebrew.outputs.repository-path }}"
          "$repository/.github/scripts/pushed-formulae.sh" \
            "$repository" \
            "${{ github.repository }}" \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Test changed formulae
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || steps.pushed-formulae.outputs.changed == 'true'
        env:
          ADDED_FORMULAE: ${{ steps.pushed-formulae.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ steps.pushed-formulae.outputs.deleted_formulae }}
          TESTING_FORMULAE: ${{ steps.pushed-formulae.outputs.testing_formulae }}
        shell: bash
        run: |
          args=(test-bot --only-formulae)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ -z "$TESTING_FORMULAE" ]] || args+=("--testing-formulae=$TESTING_FORMULAE")
            [[ -z "$ADDED_FORMULAE" ]] || args+=("--added-formulae=$ADDED_FORMULAE")
            [[ -z "$DELETED_FORMULAE" ]] || args+=("--deleted-formulae=$DELETED_FORMULAE")
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--testing-formulae=nightwatcher314/formula/zotero-pdf2zh-next)
          fi
          brew "${args[@]}"

      - name: Reject ignored test-bot failures
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || steps.pushed-formulae.outputs.changed == 'true'
        run: |
          test -f steps_output.txt
          ! grep -Eq 'failed steps? ignored' steps_output.txt

      - name: Require PDF2Zh bottle after manual validation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          shopt -s nullglob
          bottles=(zotero-pdf2zh-next--*.bottle*.tar.gz)
          metadata=(zotero-pdf2zh-next--*.bottle.json)
          test "${#bottles[@]}" -gt 0
          test "${#metadata[@]}" -gt 0

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
