name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        include:
          # GitHub retires the macos-14 ARM runner on 2026-11-02.
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-26
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Detect formulae changed by push
        id: pushed-formulae
        if: github.event_name == 'push'
        run: |
          repository="${{ steps.set-up-homebrew.outputs.repository-path }}"
          "$repository/.github/scripts/pushed-formulae.sh" \
            "$repository" \
            "${{ github.repository }}" \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            >> "$GITHUB_OUTPUT"

      - name: Test changed formulae
        if: github.event_name == 'pull_request' || steps.pushed-formulae.outputs.changed == 'true'
        env:
          ADDED_FORMULAE: ${{ steps.pushed-formulae.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ steps.pushed-formulae.outputs.deleted_formulae }}
          TESTING_FORMULAE: ${{ steps.pushed-formulae.outputs.testing_formulae }}
        shell: bash
        run: |
          args=(test-bot --only-formulae)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ -z "$TESTING_FORMULAE" ]] || args+=("--testing-formulae=$TESTING_FORMULAE")
            [[ -z "$ADDED_FORMULAE" ]] || args+=("--added-formulae=$ADDED_FORMULAE")
            [[ -z "$DELETED_FORMULAE" ]] || args+=("--deleted-formulae=$DELETED_FORMULAE")
          fi
          brew "${args[@]}"

      - name: Reject ignored test-bot failures
        if: github.event_name == 'pull_request' || steps.pushed-formulae.outputs.changed == 'true'
        run: |
          test -f steps_output.txt
          ! grep -Eq 'failed steps? ignored' steps_output.txt

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
